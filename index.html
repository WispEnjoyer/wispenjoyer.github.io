<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zap Studio Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--yellow:#f5d90a;--clay:#d97757}
body{margin:0;min-height:100vh;overflow-x:hidden;position:relative;background:#141414;color:#ffffffcf;font:14px/1.5 'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:2px solid #f5d90a55;box-shadow:0 0 80px 10px #f5d90a2e, inset 0 0 60px #f5d90a1f}
.ring.a{width:420px;height:420px;top:-180px;left:-200px}
.ring.b{width:300px;height:300px;top:60px;left:-40px;opacity:.7}
.ring.c{width:520px;height:520px;bottom:-260px;right:-220px}
.ring.d{width:260px;height:260px;bottom:-60px;right:60px;opacity:.7}
.dots{position:absolute;top:34px;right:40px;width:120px;height:80px;background-image:radial-gradient(var(--yellow) 1.6px, transparent 1.6px);background-size:16px 16px;opacity:.55}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:90px;flex-wrap:wrap;padding:60px 40px}
.intro{max-width:420px}
.intro h1{margin:0 0 18px;font:700 52px/1.05 'Chakra Petch',sans-serif;letter-spacing:.5px;color:#fff}
.intro h1 span{display:block;color:var(--yellow)}
.intro p{margin:0 0 30px;font-size:16px;line-height:1.6;color:#ffffffb0;max-width:340px}
.badge{display:inline-flex;align-items:center;gap:12px}
.badge .ic-box{width:44px;height:44px;border-radius:12px;background:#ffffff12;border:1px solid #ffffff1f;display:grid;place-items:center;color:var(--yellow)}
.badge .ic-box svg{width:20px;height:20px}
.badge b{display:block;font-size:14px;color:#fff}
.badge span{font-size:12.5px;color:#ffffff80}

.card-wrap{position:relative;width:min(400px,calc(100vw - 48px));border-radius:22px;padding:2px;overflow:hidden;isolation:isolate;box-shadow:0 30px 80px #000a}
.card-wrap::before{content:'';position:absolute;inset:-100%;background:conic-gradient(from 0deg,transparent 0deg,var(--yellow) 35deg,transparent 100deg,transparent 260deg,var(--yellow) 320deg,transparent 360deg);animation:spin 5s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;border-radius:20px;padding:38px 34px 30px;background:rgba(28,28,28,.86);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
form{margin:0}
.card h2{margin:0 0 6px;font:700 26px 'Chakra Petch',sans-serif;color:#fff}
.card h2 span{color:var(--yellow)}
.card .sub{margin:0 0 26px;font-size:13.5px;color:#ffffff8a}
.field{position:relative;margin-bottom:16px}
.field svg.lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#ffffff70;pointer-events:none}
input{display:block;width:100%;padding:13px 42px;border-radius:10px;border:1px solid #ffffff26;background:#00000040;color:#fff;font:inherit;font-size:14.5px}
input::placeholder{color:#ffffff5c}
input:focus-visible,button:focus-visible,.eye:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input:focus{border-color:#f5d90a80}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:none;color:#ffffff70;cursor:pointer;display:grid;place-items:center;border-radius:6px}
.eye:hover{background:#ffffff14;color:#fff}
.eye svg{width:17px;height:17px}
button[type=submit]{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:0;border-radius:10px;background:var(--yellow);color:#191919;font:700 15px 'IBM Plex Sans',sans-serif;cursor:pointer;box-shadow:0 8px 24px #f5d90a40}
button[type=submit]:hover{filter:brightness(1.05)}
button[type=submit]:disabled{opacity:.6;cursor:wait}
button[type=submit] svg{width:16px;height:16px}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 18px;color:#ffffff70;font-size:11.5px}
.divider .line{flex:1;height:1px;background:#ffffff22}
.divider svg{width:13px;height:13px;color:var(--yellow)}
.foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;font:500 11.5px/1 'IBM Plex Mono',monospace;color:#ffffff70}
.foot svg{width:13px;height:13px;color:var(--clay)}
#err{min-height:20px;margin:10px 0 0;color:#ff8a80;font-size:12.5px;text-align:center}
@media (max-width:860px){.wrap{gap:40px;padding:40px 24px}.intro{text-align:center;max-width:100%}.badge{margin:0 auto}.intro p{margin-left:auto;margin-right:auto}}
@media (prefers-reduced-motion:reduce){.card-wrap::before{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="ring a"></div><div class="ring b"></div><div class="ring c"></div><div class="ring d"></div>
  <div class="dots"></div>
</div>
<div class="wrap">
  <div class="intro">
    <h1>ZAP STUDIO<span>WIKI</span></h1>
    <p>The internal hub for the moderation team &mdash; rules, guidelines and everything else, kept in one place.</p>
    <div class="badge">
      <span class="ic-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 2.8-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 13.2c2.3.2 3.9 1.9 4.4 4.8"/></svg></span>
      <span><b>Moderation team</b><span>Internal access only</span></span>
    </div>
  </div>

  <div class="card-wrap">
    <div class="card">
      <h2>Welcome <span>Back</span></h2>
      <p class="sub">Sign in to access Zap Studio Wiki</p>
      <form id="f" autocomplete="off">
        <div class="field">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
          <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password" autofocus>
          <button type="button" class="eye" id="eyeBtn" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button id="go" type="submit">Unlock <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></button>
        <p id="err" role="alert"></p>
      </form>
      <div class="divider"><span class="line"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.2 8.5-7 10-3.8-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Single password for all<span class="line"></span></div>
      <div class="foot">
        <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><g><path d="M50 50 L54 30 A20 20 0 0 1 58 31 Z"/><path d="M50 50 L68 38 A20 20 0 0 1 71 41 Z"/><path d="M50 50 L69 60 A20 20 0 0 1 68 64 Z"/><path d="M50 50 L58 69 A20 20 0 0 1 54 70 Z"/><path d="M50 50 L42 70 A20 20 0 0 1 38 69 Z"/><path d="M50 50 L31 64 A20 20 0 0 1 30 60 Z"/><path d="M50 50 L31 41 A20 20 0 0 1 32 38 Z"/><path d="M50 50 L42 31 A20 20 0 0 1 46 30 Z"/></g></svg>
        Powered by Claude.ai
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById('eyeBtn').addEventListener('click', function(){
  var pw = document.getElementById('pw'), showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  this.setAttribute('aria-pressed', String(!showing));
  this.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
});
</script>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(pw){
  var d=b64(P), salt=d.slice(0,16), iv=d.slice(16,28), ct=d.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
var f=document.getElementById("f"), pwEl=document.getElementById("pw"), err=document.getElementById("err"), btn=document.getElementById("go");
async function attempt(pw, silent){
  if(!window.crypto||!crypto.subtle){err.textContent="This page has to be opened over HTTPS.";return;}
  btn.disabled=true; if(!silent) err.textContent="";
  try{
    var html=await unlock(pw);
    try{sessionStorage.setItem("zw",pw);}catch(x){}
    show(html);
  }catch(x){
    try{sessionStorage.removeItem("zw");}catch(y){}
    if(!silent){err.textContent="Wrong password. Try again.";pwEl.select();}
    btn.disabled=false;
  }
}
f.addEventListener("submit",function(e){e.preventDefault();if(pwEl.value)attempt(pwEl.value,false);});
