*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#191919;color:#ffffffcf;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
form{width:min(340px,calc(100vw - 40px));text-align:center}

.logo{display:block;height:44px;margin:0 auto 8px}
.by{margin:0 0 30px;color:#ffffff80;font-size:13px}

input{display:block;width:100%;padding:11px 12px;border-radius:8px;border:1px solid #ffffff2b;background:#242424;color:#fff;font:inherit;font-size:15px}

button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#1d9fcc;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{min-height:22px;margin-top:12px;color:#ff8a80;font-size:13px}
</style>

  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
var f=document.getElementById("f"), pwEl=document.getElementById("pw"), err=document.getElementById("err"), btn=document.getElementById("go");
async function attempt(pw, silent){
  if(!window.crypto||!crypto.subtle){err.textContent="This page has to be opened over HTTPS.";return;}
  btn.disabled=true; if(!silent) err.textContent="";
  try{
    var html=await unlock(pw);
    try{sessionStorage.setItem("zw",pw);}catch(x){}
    show(html);
  }catch(x){
    try{sessionStorage.removeItem("zw");}catch(y){}
    if(!silent){err.textContent="Wrong password. Try again.";pwEl.select();}
    btn.disabled=false;
  }
}
f.addEventListener("submit",function(e){e.preventDefault();if(pwEl.value)attempt(pwEl.value,false);});
try{var saved=sessionStorage.getItem("zw");if(saved)attempt(saved,true);}catch(x){}
